name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # The platforms pixi.toml supports: linux-64, osx-arm64, osx-64.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Installs pixi and the project's locked default environment, cached by pixi.lock.
      - uses: prefix-dev/setup-pixi@v0.11.3
      - run: pixi run checks
