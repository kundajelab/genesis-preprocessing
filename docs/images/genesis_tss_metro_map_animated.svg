<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 870" role="img" aria-labelledby="title description">
<title id="title">GENESIS / TSS MAPPING</title>
<desc id="description">CAGE, TSS-seq, csRNA-seq, RAMPAGE and Smar2C2 · per-base TSS tags · paraclu clusters. The TSS read&#x27;s 5&#x27; end is the TSS: only fixed barcode bases are trimmed there; the 3&#x27; end is adapter- and quality-trimmed. CAGE&#x27;s cap G moves tags 1 base downstream, as in FANTOM; template-switch Gs are soft-clipped; Smar2C2 UMIs count once. paraclu clusters each strand; FANTOM&#x27;s paraclu-cut keeps clusters ≤ 200 bases with a 2-fold density rise. No plant thresholds.</desc>
<style>
    svg{--bg:#fbfcfe;--text:#172c3d;--muted:#536779;--panel:#e2e8ef;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:32px;font-weight:700;letter-spacing:1px;fill:var(--text)}
    .subtitle,.note{font-size:17px;fill:var(--muted)}
    .label{font-size:21px;font-weight:700;fill:var(--text)}
    .detail{font-size:16px;fill:var(--muted)}
    .station{fill:var(--bg);stroke-width:4}
    .line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .planned{stroke-dasharray:9 9}
    .flow{fill:none;stroke:white;stroke-width:2;stroke-dasharray:2 38;stroke-linecap:round;animation:travel 12s linear infinite;pointer-events:none}
    @keyframes travel{to{stroke-dashoffset:-400}}
    @media(prefers-reduced-motion:reduce){.flow{display:none}}
    @media(prefers-color-scheme:dark){svg{--bg:#14212d;--text:#eff6fc;--muted:#bdcbd6;--panel:#344957}.line,.station{filter:brightness(1.25)}}
    @media print{.flow{display:none}svg{--bg:#fff;--text:#172c3d;--muted:#536779;--panel:#e2e8ef}}
    </style>
<rect width="1480" height="870" fill="var(--bg)"/>
<text class="title" x="48" y="52">GENESIS / TSS MAPPING</text>
<text class="subtitle" x="48" y="85">CAGE, TSS-seq, csRNA-seq, RAMPAGE and Smar2C2 · per-base TSS tags · paraclu clusters</text>
<path id="route-0" class="line" stroke="#087f8c" d="M 140 330 L 1060 330"><title>Reads are trimmed, aligned and reduced to their 5&#x27; ends</title></path>
<path class="flow" style="animation-delay:-0s" d="M 140 330 L 1060 330"/>
<path id="route-1" class="line" stroke="#087f8c" d="M 370 330 L 471 330 Q 485 330 485 344 L 485 496 Q 485 510 499 510 L 600 510"><title>Smar2C2 read pairs</title></path>
<path class="flow" style="animation-delay:-1s" d="M 370 330 L 471 330 Q 485 330 485 344 L 485 496 Q 485 510 499 510 L 600 510"/>
<path id="route-2" class="line" stroke="#087f8c" d="M 600 510 L 701 510 Q 715 510 715 496 L 715 344 Q 715 330 701 330 L 600 330"><title>Extracted TSS reads with their UMIs</title></path>
<path class="flow" style="animation-delay:-2s" d="M 600 510 L 701 510 Q 715 510 715 496 L 715 344 Q 715 330 701 330 L 600 330"/>
<path id="route-3" class="line" stroke="#ce6030" d="M 1060 330 L 1290 330"><title>Tags per strand give clusters</title></path>
<path class="flow" style="animation-delay:-3s" d="M 1060 330 L 1290 330"/>
<path id="route-4" class="line" stroke="#9260b7" d="M 1290 330 L 1290 510"><title>Clusters feed QC</title></path>
<path class="flow" style="animation-delay:-4s" d="M 1290 330 L 1290 510"/>
<path id="route-5" class="line" stroke="#9260b7" d="M 1060 330 L 1060 586 Q 1060 600 1074 600 L 1161 600 Q 1175 600 1175 586 L 1175 524 Q 1175 510 1189 510 L 1290 510"><title>Tags feed QC</title></path>
<path class="flow" style="animation-delay:-5s" d="M 1060 330 L 1060 586 Q 1060 600 1074 600 L 1161 600 Q 1175 600 1175 586 L 1175 524 Q 1175 510 1189 510 L 1290 510"/>
<path id="route-6" class="line" stroke="#9260b7" d="M 370 330 L 370 180"><title>Raw reads feed FastQC</title></path>
<path class="flow" style="animation-delay:-6s" d="M 370 330 L 370 180"/>
<path id="route-7" class="line" stroke="#9260b7" d="M 370 180 L 1290 180"><title>FastQC reports feed MultiQC</title></path>
<path class="flow" style="animation-delay:-7s" d="M 370 180 L 1290 180"/>
<path id="route-8" class="line" stroke="#9260b7" d="M 1290 510 L 1391 510 Q 1405 510 1405 496 L 1405 194 Q 1405 180 1391 180 L 1290 180"><title>TSS QC, cutadapt and STAR logs feed MultiQC</title></path>
<path class="flow" style="animation-delay:-8s" d="M 1290 510 L 1391 510 Q 1405 510 1405 496 L 1405 194 Q 1405 180 1391 180 L 1290 180"/>
<path id="route-9" class="line" stroke="#4169b1" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"><title>Build or verify chromosome sizes</title></path>
<path class="flow" style="animation-delay:-9s" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"/>
<path id="route-10" class="line" stroke="#4169b1" d="M 140 510 L 370 510"><title>Annotation contigs must be in the FASTA</title></path>
<path class="flow" style="animation-delay:-10s" d="M 140 510 L 370 510"/>
<path id="route-11" class="line" stroke="#4169b1" d="M 370 510 L 370 676 Q 370 690 384 690 L 600 690"><title>Annotated junctions feed the STAR index</title></path>
<path class="flow" style="animation-delay:-11s" d="M 370 510 L 370 676 Q 370 690 384 690 L 600 690"/>
<path id="route-12" class="line" stroke="#4169b1" d="M 600 690 L 816 690 Q 830 690 830 676 L 830 330"><title>Verified index and intron limit feed alignment</title></path>
<path class="flow" style="animation-delay:-0s" d="M 600 690 L 816 690 Q 830 690 830 676 L 830 330"/>
<path id="route-13" class="line" stroke="#4169b1" d="M 370 510 L 370 766 Q 370 780 384 780 L 1336 780 Q 1350 780 1350 766 L 1350 524 Q 1350 510 1336 510 L 1290 510"><title>Annotated transcript starts feed QC</title></path>
<path class="flow" style="animation-delay:-1s" d="M 370 510 L 370 766 Q 370 780 384 780 L 1336 780 Q 1350 780 1350 766 L 1350 524 Q 1350 510 1336 510 L 1290 510"/>
<g id="samples"><title>Sample sheet: Method + trimming</title>
<circle class="station" cx="140" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="140" y="290">Sample sheet</text>
<text class="detail" text-anchor="middle" x="140" y="313">Method + trimming</text></g>
<g id="DOWNLOAD"><title>Download: Unmodified raw reads</title>
<circle class="station" cx="370" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="370" y="290">Download</text>
<text class="detail" text-anchor="middle" x="370" y="313">Unmodified raw reads</text></g>
<g id="TSS_EXTRACT"><title>Smar2C2 reads: Primer + UMI, either mate</title>
<circle class="station" cx="600" cy="510" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="600" y="470">Smar2C2 reads</text>
<text class="detail" text-anchor="middle" x="600" y="493">Primer + UMI, either mate</text></g>
