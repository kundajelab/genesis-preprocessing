<path id="route-3" class="line" stroke="#9260b7" d="M 370 180 L 1290 180"><title>FastQC reports feed MultiQC</title></path>
<path id="route-4" class="line" stroke="#9260b7" d="M 600 330 L 701 330 Q 715 330 715 316 L 715 264 Q 715 250 729 250 L 1391 250 Q 1405 250 1405 236 L 1405 194 Q 1405 180 1391 180 L 1290 180"><title>Trimming, alignment and filter reports feed MultiQC</title></path>
<path id="route-5" class="line" stroke="#438362" d="M 1060 330 L 1161 330 Q 1175 330 1175 344 L 1175 676 Q 1175 690 1161 690 L 1060 690"><title>Usable reads give shifted cut sites</title></path>
<path id="route-6" class="line" stroke="#9260b7" d="M 1290 330 L 1290 510"><title>Peaks give FRiP</title></path>
<path id="route-7" class="line" stroke="#9260b7" d="M 1060 690 L 1276 690 Q 1290 690 1290 676 L 1290 510"><title>Cut sites give the TSS profile</title></path>
<path id="route-8" class="line" stroke="#9260b7" d="M 1290 510 L 1391 510 Q 1405 510 1405 496 L 1405 194 Q 1405 180 1391 180 L 1290 180"><title>ATAC QC table and TSS profile feed MultiQC</title></path>
<path id="route-9" class="line" stroke="#4169b1" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"><title>Build or verify chromosome sizes</title></path>
<path id="route-10" class="line" stroke="#4169b1" d="M 140 690 L 370 690"><title>Build or verify index</title></path>
<path id="route-11" class="line" stroke="#4169b1" d="M 370 690 L 370 614 Q 370 600 384 600 L 816 600 Q 830 600 830 586 L 830 330"><title>Verified index feeds alignment</title></path>
<path id="route-12" class="line" stroke="#4169b1" d="M 140 510 L 931 510 Q 945 510 945 496 L 945 344 Q 945 330 959 330 L 1060 330"><title>Chromosome sizes give nuclear contigs and genome size</title></path>
<path id="route-13" class="line" stroke="#4169b1" d="M 600 690 L 701 690 Q 715 690 715 704 L 715 721 Q 715 735 729 735 L 1336 735 Q 1350 735 1350 721 L 1350 524 Q 1350 510 1336 510 L 1290 510"><title>Gene starts define strand-aware TSS windows</title></path>
