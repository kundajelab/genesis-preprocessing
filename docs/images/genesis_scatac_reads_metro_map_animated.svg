<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 870" role="img" aria-labelledby="title description">
<title id="title">GENESIS / scATAC FROM 10x READS</title>
<desc id="description">NCBI SRA runs with the barcode read · chromap fragments · shared pseudobulk steps. Runs come from NCBI SRA, which keeps the 10x barcode read; the barcode and genomic reads are told apart by length. chromap writes 10x fragments (Tn5 offsets applied), corrects barcodes against a user-supplied list and removes duplicates per cell. Without an authors&#x27; cell list, barcodes with enough nuclear fragments form one group. No plant TSS threshold is applied.</desc>
<style>
    svg{--bg:#fbfcfe;--text:#172c3d;--muted:#536779;--panel:#e2e8ef;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:32px;font-weight:700;letter-spacing:1px;fill:var(--text)}
    .subtitle,.note{font-size:17px;fill:var(--muted)}
    .label{font-size:21px;font-weight:700;fill:var(--text)}
    .detail{font-size:16px;fill:var(--muted)}
    .station{fill:var(--bg);stroke-width:4}
    .line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .planned{stroke-dasharray:9 9}
    .flow{fill:none;stroke:white;stroke-width:2;stroke-dasharray:2 38;stroke-linecap:round;animation:travel 12s linear infinite;pointer-events:none}
    @keyframes travel{to{stroke-dashoffset:-400}}
    @media(prefers-reduced-motion:reduce){.flow{display:none}}
    @media(prefers-color-scheme:dark){svg{--bg:#14212d;--text:#eff6fc;--muted:#bdcbd6;--panel:#344957}.line,.station{filter:brightness(1.25)}}
    @media print{.flow{display:none}svg{--bg:#fff;--text:#172c3d;--muted:#536779;--panel:#e2e8ef}}
    </style>
<rect width="1480" height="870" fill="var(--bg)"/>
<text class="title" x="48" y="52">GENESIS / scATAC FROM 10x READS</text>
<text class="subtitle" x="48" y="85">NCBI SRA runs with the barcode read · chromap fragments · shared pseudobulk steps</text>
<path id="route-0" class="line" stroke="#087f8c" d="M 140 330 L 1060 330"><title>Runs are downloaded, mapped per library, then cells are called</title></path>
<path class="flow" style="animation-delay:-0s" d="M 140 330 L 1060 330"/>
<path id="route-1" class="line" stroke="#ce6030" d="M 1060 330 L 1290 330"><title>Each group&#x27;s fragments give peaks</title></path>
<path class="flow" style="animation-delay:-1s" d="M 1060 330 L 1290 330"/>
<path id="route-2" class="line" stroke="#9260b7" d="M 1290 330 L 1290 510"><title>Peaks give FRiP</title></path>
<path class="flow" style="animation-delay:-2s" d="M 1290 330 L 1290 510"/>
<path id="route-3" class="line" stroke="#438362" d="M 1060 330 L 1060 690"><title>Each group&#x27;s fragments give cut sites</title></path>
<path class="flow" style="animation-delay:-3s" d="M 1060 330 L 1060 690"/>
<path id="route-4" class="line" stroke="#9260b7" d="M 1060 690 L 1276 690 Q 1290 690 1290 676 L 1290 510"><title>Cut sites give the TSS profile</title></path>
<path class="flow" style="animation-delay:-4s" d="M 1060 690 L 1276 690 Q 1290 690 1290 676 L 1290 510"/>
<path id="route-5" class="line" stroke="#9260b7" d="M 1290 510 L 1391 510 Q 1405 510 1405 496 L 1405 194 Q 1405 180 1391 180 L 1290 180"><title>Group QC and TSS profiles feed MultiQC</title></path>
<path class="flow" style="animation-delay:-5s" d="M 1290 510 L 1391 510 Q 1405 510 1405 496 L 1405 194 Q 1405 180 1391 180 L 1290 180"/>
<path id="route-6" class="line" stroke="#4169b1" d="M 370 510 L 471 510 Q 485 510 485 496 L 485 344 Q 485 330 499 330 L 600 330"><title>Barcodes are corrected against the list</title></path>
<path class="flow" style="animation-delay:-6s" d="M 370 510 L 471 510 Q 485 510 485 496 L 485 344 Q 485 330 499 330 L 600 330"/>
<path id="route-7" class="line" stroke="#4169b1" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"><title>Build or verify chromosome sizes</title></path>
<path class="flow" style="animation-delay:-7s" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"/>
<path id="route-8" class="line" stroke="#4169b1" d="M 140 690 L 526 690 Q 540 690 540 676 L 540 344 Q 540 330 554 330 L 600 330"><title>chromap indexes the FASTA</title></path>
<path class="flow" style="animation-delay:-8s" d="M 140 690 L 526 690 Q 540 690 540 676 L 540 344 Q 540 330 554 330 L 600 330"/>
<path id="route-9" class="line" stroke="#4169b1" d="M 140 510 L 241 510 Q 255 510 255 524 L 255 586 Q 255 600 269 600 L 931 600 Q 945 600 945 586 L 945 344 Q 945 330 959 330 L 1060 330"><title>Every fragment must lie on a contig</title></path>
<path class="flow" style="animation-delay:-9s" d="M 140 510 L 241 510 Q 255 510 255 524 L 255 586 Q 255 600 269 600 L 931 600 Q 945 600 945 586 L 945 344 Q 945 330 959 330 L 1060 330"/>
<path id="route-10" class="line" stroke="#4169b1" d="M 600 690 L 701 690 Q 715 690 715 704 L 715 766 Q 715 780 729 780 L 1336 780 Q 1350 780 1350 766 L 1350 524 Q 1350 510 1336 510 L 1290 510"><title>Gene starts define strand-aware TSS windows</title></path>
<path class="flow" style="animation-delay:-10s" d="M 600 690 L 701 690 Q 715 690 715 704 L 715 766 Q 715 780 729 780 L 1336 780 Q 1350 780 1350 766 L 1350 524 Q 1350 510 1336 510 L 1290 510"/>
