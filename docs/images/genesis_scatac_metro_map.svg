<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 870" role="img" aria-labelledby="title description">
<title id="title">GENESIS / scATAC PSEUDOBULKS</title>
<desc id="description">Published fragments · one pseudobulk per cell group · separate libraries. Starts from published fragments and a cell list. Organelle fragments and unlisted barcodes are counted, then dropped. Each group gets MACS3 peaks, a per-base cut-site bigWig (first and last fragment base), FRiP and TSS enrichment. QC is diagnostic, with no plant thresholds. Groups stay within one library; libraries are never pooled.</desc>
<style>
    svg{--bg:#fbfcfe;--text:#172c3d;--muted:#536779;--panel:#e2e8ef;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:32px;font-weight:700;letter-spacing:1px;fill:var(--text)}
    .subtitle,.note{font-size:17px;fill:var(--muted)}
    .label{font-size:21px;font-weight:700;fill:var(--text)}
    .detail{font-size:16px;fill:var(--muted)}
    .station{fill:var(--bg);stroke-width:4}
    .line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .flow{fill:none;stroke:white;stroke-width:2;stroke-dasharray:2 38;stroke-linecap:round;animation:travel 12s linear infinite;pointer-events:none}
    @keyframes travel{to{stroke-dashoffset:-400}}
    @media(prefers-reduced-motion:reduce){.flow{display:none}}
    @media(prefers-color-scheme:dark){svg{--bg:#14212d;--text:#eff6fc;--muted:#bdcbd6;--panel:#344957}.line,.station{filter:brightness(1.25)}}
    @media print{.flow{display:none}svg{--bg:#fff;--text:#172c3d;--muted:#536779;--panel:#e2e8ef}}
    </style>
<rect width="1480" height="870" fill="var(--bg)"/>
<text class="title" x="48" y="52">GENESIS / scATAC PSEUDOBULKS</text>
<text class="subtitle" x="48" y="85">Published fragments · one pseudobulk per cell group · separate libraries</text>
<path id="route-0" class="line" stroke="#087f8c" d="M 140 330 L 830 330"><title>Fragments and cells are checked, then split into groups</title></path>
<path class="flow" style="animation-delay:-0s" d="M 140 330 L 830 330"/>
<path id="route-1" class="line" stroke="#ce6030" d="M 830 330 L 1060 330"><title>Each group&#x27;s fragments give peaks</title></path>
<path class="flow" style="animation-delay:-1s" d="M 830 330 L 1060 330"/>
<path id="route-2" class="line" stroke="#9260b7" d="M 1060 330 L 1290 330"><title>Peaks give FRiP</title></path>
<path class="flow" style="animation-delay:-2s" d="M 1060 330 L 1290 330"/>
<path id="route-3" class="line" stroke="#438362" d="M 830 330 L 931 330 Q 945 330 945 344 L 945 676 Q 945 690 959 690 L 1060 690"><title>Each group&#x27;s fragments give cut sites</title></path>
<path class="flow" style="animation-delay:-3s" d="M 830 330 L 931 330 Q 945 330 945 344 L 945 676 Q 945 690 959 690 L 1060 690"/>
<path id="route-4" class="line" stroke="#9260b7" d="M 1060 690 L 1276 690 Q 1290 690 1290 676 L 1290 330"><title>Cut sites give the TSS profile</title></path>
<path class="flow" style="animation-delay:-4s" d="M 1060 690 L 1276 690 Q 1290 690 1290 676 L 1290 330"/>
<path id="route-5" class="line" stroke="#9260b7" d="M 1290 330 L 1290 180"><title>Group QC and TSS profiles feed MultiQC</title></path>
<path class="flow" style="animation-delay:-5s" d="M 1290 330 L 1290 180"/>
<path id="route-6" class="line" stroke="#9260b7" d="M 600 330 L 701 330 Q 715 330 715 316 L 715 264 Q 715 250 729 250 L 1391 250 Q 1405 250 1405 236 L 1405 194 Q 1405 180 1391 180 L 1290 180"><title>Library summary feeds MultiQC</title></path>
<path class="flow" style="animation-delay:-6s" d="M 600 330 L 701 330 Q 715 330 715 316 L 715 264 Q 715 250 729 250 L 1391 250 Q 1405 250 1405 236 L 1405 194 Q 1405 180 1391 180 L 1290 180"/>
<path id="route-7" class="line" stroke="#4169b1" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"><title>Build or verify chromosome sizes</title></path>
<path class="flow" style="animation-delay:-7s" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"/>
<path id="route-8" class="line" stroke="#4169b1" d="M 140 510 L 471 510 Q 485 510 485 496 L 485 344 Q 485 330 499 330 L 600 330"><title>Every fragment must lie on a contig</title></path>
<path class="flow" style="animation-delay:-8s" d="M 140 510 L 471 510 Q 485 510 485 496 L 485 344 Q 485 330 499 330 L 600 330"/>
<path id="route-9" class="line" stroke="#4169b1" d="M 600 690 L 701 690 Q 715 690 715 704 L 715 721 Q 715 735 729 735 L 1336 735 Q 1350 735 1350 721 L 1350 344 Q 1350 330 1336 330 L 1290 330"><title>Gene starts define strand-aware TSS windows</title></path>
<path class="flow" style="animation-delay:-9s" d="M 600 690 L 701 690 Q 715 690 715 704 L 715 721 Q 715 735 729 735 L 1336 735 Q 1350 735 1350 721 L 1350 344 Q 1350 330 1336 330 L 1290 330"/>
