<circle class="station" cx="370" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="370" y="290">Download</text>
<text class="detail" text-anchor="middle" x="370" y="313">Published files</text></g>
<g id="SCATAC_FRAGMENTS"><title>Fragments: Listed cells, nuclear</title>
<circle class="station" cx="600" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="600" y="290">Fragments</text>
<text class="detail" text-anchor="middle" x="600" y="313">Listed cells, nuclear</text></g>
<g id="groups"><title>Cell groups: One pseudobulk each</title>
