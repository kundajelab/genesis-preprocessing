<text class="label" text-anchor="middle" x="830" y="290">Cell groups</text>
<text class="detail" text-anchor="middle" x="830" y="313">One pseudobulk each</text></g>
<g id="SCATAC_PEAKS"><title>MACS3 peaks: Per group</title>
<circle class="station" cx="1060" cy="330" r="9" stroke="#ce6030"/>
<text class="label" text-anchor="middle" x="1060" y="290">MACS3 peaks</text>
<text class="detail" text-anchor="middle" x="1060" y="313">Per group</text></g>
