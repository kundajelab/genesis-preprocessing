<text class="detail" text-anchor="middle" x="370" y="673">Investigate + retry</text></g>
<g id="retry"><title>Bounded retries: Confirmed transient errors</title>
<circle class="station" cx="600" cy="180" r="9" stroke="#9260b7"/>
<text class="label" text-anchor="middle" x="600" y="140">Bounded retries</text>
<text class="detail" text-anchor="middle" x="600" y="163">Confirmed transient errors</text></g>
