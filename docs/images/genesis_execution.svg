<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 870" role="img" aria-labelledby="title description">
<title id="title">GENESIS / RUN AND REVIEW</title>
<desc id="description">Start on one Linux server. Add managed clusters or independent workers when needed.. Authentication stays under site control. No keys, permissions or cluster services are changed by Genesis. Healthy datasets continue. Failed datasets enter review; unreachable workers are never blindly resubmitted. Cluster profiles require site validation. Monitoring reports problems; people resolve data and scientific questions.</desc>
<style>
    svg{--bg:#fbfcfe;--text:#172c3d;--muted:#536779;--panel:#e2e8ef;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:32px;font-weight:700;letter-spacing:1px;fill:var(--text)}
    .subtitle,.note{font-size:17px;fill:var(--muted)}
    .label{font-size:21px;font-weight:700;fill:var(--text)}
    .detail{font-size:16px;fill:var(--muted)}
    .station{fill:var(--bg);stroke-width:4}
    .line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .planned{stroke-dasharray:9 9}
    .flow{fill:none;stroke:white;stroke-width:2;stroke-dasharray:2 38;stroke-linecap:round;animation:travel 12s linear infinite;pointer-events:none}
    @keyframes travel{to{stroke-dashoffset:-400}}
    @media(prefers-reduced-motion:reduce){.flow{display:none}}
    @media(prefers-color-scheme:dark){svg{--bg:#14212d;--text:#eff6fc;--muted:#bdcbd6;--panel:#344957}.line,.station{filter:brightness(1.25)}}
    @media print{.flow{display:none}svg{--bg:#fff;--text:#172c3d;--muted:#536779;--panel:#e2e8ef}}
    </style>
<rect width="1480" height="870" fill="var(--bg)"/>
<text class="title" x="48" y="52">GENESIS / RUN AND REVIEW</text>
<text class="subtitle" x="48" y="85">Start on one Linux server. Add managed clusters or independent workers when needed.</text>
<path id="route-0" class="line" stroke="#087f8c" d="M 140 330 L 356 330 Q 370 330 384 330 L 471 330 Q 485 330 485 316 L 485 194 Q 485 180 499 180 L 830 180"><title>Default local execution</title></path>
<path id="route-1" class="line" stroke="#4169b1" d="M 370 330 L 830 330"><title>Native scheduler submits tasks to managed compute nodes</title></path>
<path id="route-2" class="line" stroke="#438362" d="M 370 330 L 471 330 Q 485 330 485 344 L 485 496 Q 485 510 499 510 L 830 510"><title>Independent Linux workers run isolated datasets over existing SSH</title></path>
<path id="route-3" class="line" stroke="#087f8c" d="M 830 180 L 1161 180 Q 1175 180 1175 194 L 1175 316 Q 1175 330 1189 330 L 1290 330"><title>Local results</title></path>
<path id="route-4" class="line" stroke="#4169b1" d="M 830 330 L 1290 330"><title>Cluster results</title></path>
<path id="route-5" class="line" stroke="#438362" d="M 830 510 L 1161 510 Q 1175 510 1175 496 L 1175 344 Q 1175 330 1189 330 L 1290 330"><title>Worker results</title></path>
<path id="route-6" class="line" stroke="#9260b7" d="M 1290 330 L 1391 330 Q 1405 330 1405 344 L 1405 676 Q 1405 690 1391 690 L 1074 690 Q 1060 690 1046 690 L 370 690"><title>Status and unresolved issues flow to human review</title></path>
<path id="route-7" class="line" stroke="#bd527d" d="M 370 690 L 269 690 Q 255 690 255 676 L 255 344 Q 255 330 269 330 L 370 330"><title>Explicit resolution returns confirmed failed datasets to the queue</title></path>
<g id="inputs"><title>Datasets: Exact references + policy</title>
