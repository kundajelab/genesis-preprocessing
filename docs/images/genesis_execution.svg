<text class="label" text-anchor="middle" x="830" y="140">Local Linux</text>
<text class="detail" text-anchor="middle" x="830" y="163">Default Docker execution</text></g>
<g id="scheduler"><title>Cluster scheduler: Slurm / PBS / LSF / SGE</title>
