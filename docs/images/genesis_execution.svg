<text class="label" text-anchor="middle" x="140" y="290">Datasets</text>
<text class="detail" text-anchor="middle" x="140" y="313">Exact references + policy</text></g>
<g id="controller"><title>Controller: Queue + durable status</title>
<circle class="station" cx="370" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="370" y="290">Controller</text>
<text class="detail" text-anchor="middle" x="370" y="313">Queue + durable status</text></g>
<g id="local"><title>Local Linux: Default Docker execution</title>
