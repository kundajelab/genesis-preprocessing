<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 870" role="img" aria-labelledby="title description">
<title id="title">GENESIS / BULK RNA-seq</title>
<desc id="description">SE / PE libraries · STAR with plant intron limits · unique-read gene counts. The intron limit is the longest annotated intron; STAR&#x27;s default suits mammals. Up to 20 loci per read. featureCounts counts uniquely aligned reads by the sheet&#x27;s strandedness; rRNA and organelle genes stay in the counts. QC is diagnostic: the forward fraction checks the sheet&#x27;s strandedness. Replicates are never pooled.</desc>
<style>
    svg{--bg:#fbfcfe;--text:#172c3d;--muted:#536779;--panel:#e2e8ef;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:32px;font-weight:700;letter-spacing:1px;fill:var(--text)}
    .subtitle,.note{font-size:17px;fill:var(--muted)}
    .label{font-size:21px;font-weight:700;fill:var(--text)}
    .detail{font-size:16px;fill:var(--muted)}
    .station{fill:var(--bg);stroke-width:4}
    .line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .planned{stroke-dasharray:9 9}
    .flow{fill:none;stroke:white;stroke-width:2;stroke-dasharray:2 38;stroke-linecap:round;animation:travel 12s linear infinite;pointer-events:none}
    @keyframes travel{to{stroke-dashoffset:-400}}
    @media(prefers-reduced-motion:reduce){.flow{display:none}}
    @media(prefers-color-scheme:dark){svg{--bg:#14212d;--text:#eff6fc;--muted:#bdcbd6;--panel:#344957}.line,.station{filter:brightness(1.25)}}
    @media print{.flow{display:none}svg{--bg:#fff;--text:#172c3d;--muted:#536779;--panel:#e2e8ef}}
    </style>
<rect width="1480" height="870" fill="var(--bg)"/>
<text class="title" x="48" y="52">GENESIS / BULK RNA-seq</text>
<text class="subtitle" x="48" y="85">SE / PE libraries · STAR with plant intron limits · unique-read gene counts</text>
<path id="route-0" class="line" stroke="#087f8c" d="M 140 330 L 830 330"><title>Libraries download and align</title></path>
<path id="route-1" class="line" stroke="#087f8c" d="M 830 330 L 1060 330"><title>Uniquely aligned reads are counted per gene</title></path>
<path id="route-2" class="line" stroke="#9260b7" d="M 1060 330 L 1290 330"><title>Counts and assignment feed RNA QC</title></path>
<path id="route-3" class="line" stroke="#9260b7" d="M 370 330 L 370 180"><title>Raw mates independently feed FastQC</title></path>
<path id="route-4" class="line" stroke="#9260b7" d="M 370 180 L 1290 180"><title>FastQC reports feed MultiQC</title></path>
<path id="route-5" class="line" stroke="#9260b7" d="M 830 330 L 931 330 Q 945 330 945 316 L 945 264 Q 945 250 959 250 L 1391 250 Q 1405 250 1405 236 L 1405 194 Q 1405 180 1391 180 L 1290 180"><title>STAR and featureCounts logs feed MultiQC</title></path>
<path id="route-6" class="line" stroke="#9260b7" d="M 1290 330 L 1290 180"><title>RNA QC table feeds MultiQC</title></path>
<path id="route-7" class="line" stroke="#438362" d="M 830 330 L 861 330 Q 875 330 875 344 L 875 676 Q 875 690 889 690 L 1060 690"><title>Aligned reads give a CPM track</title></path>
<path id="route-8" class="line" stroke="#4169b1" d="M 140 690 L 241 690 Q 255 690 255 676 L 255 524 Q 255 510 241 510 L 140 510"><title>Build or verify chromosome sizes</title></path>
<path id="route-9" class="line" stroke="#4169b1" d="M 140 510 L 370 510"><title>Annotation contigs must be in the FASTA</title></path>
<path id="route-10" class="line" stroke="#4169b1" d="M 140 690 L 600 690"><title>FASTA feeds the STAR index</title></path>
<path id="route-11" class="line" stroke="#4169b1" d="M 370 510 L 471 510 Q 485 510 485 524 L 485 676 Q 485 690 499 690 L 600 690"><title>Annotated junctions feed the STAR index</title></path>
<path id="route-12" class="line" stroke="#4169b1" d="M 600 690 L 701 690 Q 715 690 715 676 L 715 344 Q 715 330 729 330 L 830 330"><title>Verified index and intron limit feed alignment</title></path>
<path id="route-13" class="line" stroke="#4169b1" d="M 370 510 L 931 510 Q 945 510 945 496 L 945 344 Q 945 330 959 330 L 1060 330"><title>GTF defines the genes to count</title></path>
<path id="route-14" class="line" stroke="#4169b1" d="M 370 510 L 370 586 Q 370 600 384 600 L 1336 600 Q 1350 600 1350 586 L 1350 344 Q 1350 330 1336 330 L 1290 330"><title>rRNA genes and organelle contigs feed QC</title></path>
<g id="samples"><title>Sample sheet: SE / PE + strandedness</title>
<circle class="station" cx="140" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="140" y="290">Sample sheet</text>
<text class="detail" text-anchor="middle" x="140" y="313">SE / PE + strandedness</text></g>
<g id="DOWNLOAD"><title>Download: Unmodified raw mates</title>
<circle class="station" cx="370" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="370" y="290">Download</text>
<text class="detail" text-anchor="middle" x="370" y="313">Unmodified raw mates</text></g>
<g id="RNA_ALIGN"><title>STAR: Annotated junctions</title>
<circle class="station" cx="830" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="830" y="290">STAR</text>
<text class="detail" text-anchor="middle" x="830" y="313">Annotated junctions</text></g>
<g id="RNA_COUNTS"><title>featureCounts: Unique reads, stranded</title>
<circle class="station" cx="1060" cy="330" r="9" stroke="#087f8c"/>
<text class="label" text-anchor="middle" x="1060" y="290">featureCounts</text>
<text class="detail" text-anchor="middle" x="1060" y="313">Unique reads, stranded</text></g>
<g id="RNA_QC"><title>RNA QC: Strand, rRNA, organelles</title>
<circle class="station" cx="1290" cy="330" r="9" stroke="#9260b7"/>
<text class="label" text-anchor="middle" x="1290" y="290">RNA QC</text>
<text class="detail" text-anchor="middle" x="1290" y="313">Strand, rRNA, organelles</text></g>
<g id="FASTQC"><title>FastQC: One report per mate</title>
<circle class="station" cx="370" cy="180" r="9" stroke="#9260b7"/>
<text class="label" text-anchor="middle" x="370" y="140">FastQC</text>
<text class="detail" text-anchor="middle" x="370" y="163">One report per mate</text></g>
<g id="MULTIQC_REPORT"><title>MultiQC: HTML + parsed data</title>
<circle class="station" cx="1290" cy="180" r="9" stroke="#9260b7"/>
<text class="label" text-anchor="middle" x="1290" y="140">MultiQC</text>
<text class="detail" text-anchor="middle" x="1290" y="163">HTML + parsed data</text></g>
<g id="CHROM_SIZES"><title>Chromosome sizes: Verified products</title>
<circle class="station" cx="140" cy="510" r="9" stroke="#4169b1"/>
<text class="label" text-anchor="middle" x="140" y="470">Chromosome sizes</text>
<text class="detail" text-anchor="middle" x="140" y="493">Verified products</text></g>
<g id="RNA_ANNOTATION"><title>Annotation: GTF + longest intron</title>
<circle class="station" cx="370" cy="510" r="9" stroke="#4169b1"/>
<text class="label" text-anchor="middle" x="370" y="470">Annotation</text>
<text class="detail" text-anchor="middle" x="370" y="493">GTF + longest intron</text></g>
<g id="GET_REFERENCES"><title>Reference FASTA: Hash-checked reuse</title>
<circle class="station" cx="140" cy="690" r="9" stroke="#4169b1"/>
<text class="label" text-anchor="middle" x="140" y="650">Reference FASTA</text>
<text class="detail" text-anchor="middle" x="140" y="673">Hash-checked reuse</text></g>
<g id="GET_STAR_INDEX"><title>STAR index: Hash-checked reuse</title>
<circle class="station" cx="600" cy="690" r="9" stroke="#4169b1"/>
<text class="label" text-anchor="middle" x="600" y="650">STAR index</text>
<text class="detail" text-anchor="middle" x="600" y="673">Hash-checked reuse</text></g>
<g id="RNA_TRACKS"><title>CPM track: Per-base bigWig</title>
<circle class="station" cx="1060" cy="690" r="9" stroke="#438362"/>
<text class="label" text-anchor="middle" x="1060" y="650">CPM track</text>
<text class="detail" text-anchor="middle" x="1060" y="673">Per-base bigWig</text></g>
<path d="M48 762 H1432" stroke="var(--panel)" stroke-width="2"/>
<text class="note" x="48" y="798">The intron limit is the longest annotated intron; STAR&#x27;s default suits mammals. Up to 20 loci per read.</text>
