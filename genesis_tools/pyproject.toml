[project]
name = "genesis-tools"
version = "0.1.0"
description = "Typed DAP-seq metadata and interval quantification tools"
requires-python = ">=3.14"
dependencies = ["defopt>=7,<8", "pysam>=0.24.1,<0.25"]

[project.scripts]
genesis-tools = "genesis_tools.cli:main"

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.14,<1", "ty>=0.0.30,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ty.terminal]
error-on-warning = true

