[workspace]
name = "genesis"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = [
    { name = "sherlock-linux-64", platform = "linux-64", glibc = "2.17" },
    "osx-arm64", "osx-64"
]

[tool.custom_settings]
pixi_sub_projects = []
uv_sub_projects = ["genesis_tools"]

[dependencies]
nextflow = ">=25.10.4,<26"
uv = ">=0.11.15,<0.12"
shellcheck = ">=0.11,<0.12"
micromamba = ">=2.5,<2.6"
python = "3.14.5.*"

[tasks]
pipeline-atac = { cmd = "scripts/run-pipeline.sh --workflow atac-seq", description = "Run bulk ATAC on one sample sheet. Run with --help for usage." }
pipeline-scatac = { cmd = "scripts/run-pipeline.sh --workflow scatac-seq", description = "Run scATAC pseudobulks on one sample sheet. Run with --help for usage." }
pipeline = { cmd = "scripts/run-pipeline.sh", description = "Run the pipeline on one sample sheet. Run with --help for usage." }
install-all = { cmd = "scripts/install-projects.sh", description = "Install locked environments." }
checks = { cmd = "scripts/check-projects.sh", description = "Run all checks." }
build-dockers = { cmd = "scripts/build-dockers.sh", description = "Build all the dockers for the project." }
get-latest-report = { cmd = "scripts/get-latest-report.sh", description = "Get the path to the most recent execution report. Optional argument: WORKSPACE." }
watch-log = { cmd = "scripts/watch-log.sh", description = "Follow the log of a task, given its hash (e.g. ab/123456) or a log file. Optional second argument: WORKSPACE." }
validate-docker = "uv run --frozen --project genesis_tools python tests/verify_pipeline.py --docker"
