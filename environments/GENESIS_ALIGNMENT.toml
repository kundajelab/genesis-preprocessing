[workspace]
channels = ["conda-forge", "bioconda", "nodefaults", "https://conda.anaconda.org/bioconda", "https://conda.anaconda.org/conda-forge"]
name = "genesis_alignment"
platforms = ["linux-64", "osx-64", "osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
bwa-mem2 = { version = "2.3.*", channel = "bioconda" }
bowtie = { version = ">=1.3.1,<2", channel = "bioconda" }
samtools = { version = ">=1.22,<2", channel = "bioconda" }
htslib = { version = ">=1.22,<2", channel = "bioconda" }
aria2 = { version = ">=1.37,<2", channel = "conda-forge" }
gzip = { version = ">=1.13,<2", channel = "conda-forge" }
